<template>
    <lightning-card title="Demo Data Launcher" icon-name="custom:custom57">
        <div class="slds-p-around_medium">

            <div if:true={activeScenario} class="slds-box slds-theme_success slds-m-bottom_medium">
                <p class="slds-text-body_regular">
                    <lightning-icon icon-name="utility:check" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    Active: <strong>{activeScenarioLabel}</strong>
                </p>
            </div>

            <div if:false={activeScenario} class="slds-box slds-theme_shade slds-m-bottom_medium">
                <p class="slds-text-body_regular">No scenario loaded.</p>
            </div>

            <lightning-combobox
                name="scenario"
                label="Select Scenario"
                value={selectedScenario}
                placeholder="Choose a scenario pack..."
                options={scenarioOptions}
                onchange={handleScenarioChange}
                class="slds-m-bottom_medium">
            </lightning-combobox>

            <div class="slds-button-group slds-m-bottom_medium">
                <lightning-button
                    variant="brand"
                    label="Load Scenario"
                    onclick={handleLoad}
                    disabled={isLoadDisabled}>
                </lightning-button>
                <lightning-button
                    variant="destructive"
                    label="Clear All Data"
                    onclick={handleClear}
                    disabled={isClearDisabled}>
                </lightning-button>
            </div>

            <div if:true={isLoading} class="slds-m-top_medium">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                <p class="slds-text-body_small slds-m-top_small">{loadingMessage}</p>
            </div>

            <div if:true={result} class="slds-box slds-m-top_medium">
                <p if:true={result.recordsLoaded}>Loaded: <strong>{result.recordsLoaded}</strong> records</p>
                <p if:true={result.recordsDeleted}>Cleared: <strong>{result.recordsDeleted}</strong> previous records</p>
                <p if:true={result.error} class="slds-text-color_error">Error: {result.error}</p>
            </div>

            <template if:true={tableData.length}>
                <div class="slds-m-top_medium">
                    <lightning-datatable
                        key-field="id"
                        data={tableData}
                        columns={tableColumns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
