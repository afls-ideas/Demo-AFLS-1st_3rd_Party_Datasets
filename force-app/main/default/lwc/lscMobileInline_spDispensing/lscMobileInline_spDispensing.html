<template>
    <lightning-card title="SP Dispensing & Adherence" icon-name="standard:pharmacy">
        <div slot="actions">
            <template if:true={hasData}>
                <lightning-badge label={headerBadge}></lightning-badge>
            </template>
        </div>
        <template if:false={hasData}>
            <div class="slds-p-around_medium slds-text-color_weak">No specialty pharmacy data available for this provider.</div>
        </template>
        <template if:true={hasData}>
            <!-- Flow Diagram: Manufacturer → SPs -->
            <template if:true={hasMultiplePharmacies}>
                <div class="slds-p-horizontal_medium slds-p-top_small">
                    <div class="flow-container">
                        <div class="flow-mfg">
                            <lightning-icon icon-name="standard:product_item" size="xx-small" variant="inverse"></lightning-icon>
                            <span>Makana Pharma — Immunonco (US)</span>
                        </div>
                        <div class="flow-trunk"></div>
                        <div class="flow-branch-bar"></div>
                        <div class="flow-drops">
                            <template for:each={flowCards} for:item="fc">
                                <div key={fc.id} class="flow-drop"><div class="flow-drop-line"></div></div>
                            </template>
                        </div>
                        <div class="flow-sp-grid">
                            <template for:each={flowCards} for:item="fc">
                                <div key={fc.id} class={fc.cardClass}>
                                    <div class="flow-sp-name">{fc.name}</div>
                                    <div class="flow-sp-payer">{fc.payer}</div>
                                    <div class={fc.pdcValueClass}>{fc.pdcPct}</div>
                                    <div class="flow-sp-pdc-label">adherence (PDC)</div>
                                    <div class="flow-sp-meta">
                                        <div class="flow-sp-stat">
                                            <div class="flow-sp-stat-val">{fc.totalFills}</div>
                                            <div class="flow-sp-stat-lbl">Fills</div>
                                        </div>
                                        <div class="flow-sp-stat">
                                            <div class="flow-sp-stat-val">{fc.avgDays}d</div>
                                            <div class="flow-sp-stat-lbl">Fill Time</div>
                                        </div>
                                        <div class="flow-sp-stat">
                                            <div class="flow-sp-stat-val">{fc.abandonPct}</div>
                                            <div class="flow-sp-stat-lbl">Abandon</div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- SP Channel Comparison Table -->
            <template if:true={hasMultiplePharmacies}>
                <div class="slds-p-horizontal_medium slds-p-top_medium">
                    <div class="section-header">SP Channel Comparison</div>
                    <table class="compare-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Specialty Pharmacy</th>
                                <th>PDC</th>
                                <th>Fills</th>
                                <th>Days to Fill</th>
                                <th>Abandon</th>
                                <th>Copay</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={compareRows} for:item="cr">
                                <tr key={cr.id}>
                                    <td><span class={cr.rankClass}>{cr.rank}</span></td>
                                    <td>
                                        <div class="compare-sp-name">{cr.name}</div>
                                        <div class="compare-sp-payer">{cr.payer}</div>
                                    </td>
                                    <td>
                                        <span class={cr.pdcClass}>{cr.pdc}</span>
                                        <div class="compare-bar-bg">
                                            <div class={cr.pdcBarClass} style={cr.pdcBarStyle}></div>
                                        </div>
                                    </td>
                                    <td><span class="compare-val-neutral">{cr.totalFills}</span></td>
                                    <td><span class={cr.ttfClass}>{cr.ttf}</span></td>
                                    <td><span class={cr.abandonClass}>{cr.abandon}</span></td>
                                    <td><span class={cr.copayClass}>{cr.copay}</span></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- Signals -->
            <template if:true={hasSignals}>
                <div class="slds-p-horizontal_medium slds-p-top_medium">
                    <div class="section-header">Signals & Recommended Actions</div>
                    <template for:each={signals} for:item="sig">
                        <div key={sig.id} class={sig.bannerClass}>
                            <div class="signal-header">
                                <lightning-icon icon-name={sig.icon} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                <span class="slds-text-body_small"><strong>{sig.label}:</strong> {sig.message}</span>
                            </div>
                            <div class="signal-action">Next Step: {sig.action}</div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Detail Table -->
            <div class="slds-p-horizontal_medium slds-p-vertical_medium">
                <div class="section-header">Dispensing Detail</div>
                <lightning-datatable key-field="id" data={tableData} columns={columns} hide-checkbox-column></lightning-datatable>
            </div>
        </template>
    </lightning-card>
</template>
